name: en_tube
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  youtube_player_flutter: ^9.0.3
  shared_preferences: ^2.5.3
  provider: ^6.1.2
  syncfusion_flutter_charts: ^31.2.12
  flutter_instagram_storyboard: ^1.0.1
  sqflite: ^2.4.2
  path: ^1.9.1
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  video_player: ^2.10.1
  flutter_svg: ^2.2.3
  easy_localization: ^3.0.8
  cached_network_image: ^3.4.1
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  equatable: ^2.0.7
  formz: ^0.8.0
  fl_chart: ^0.68.0
  google_fonts: ^6.3.3
  shimmer: ^3.0.0
  flutter_native_splash: ^2.4.7
  fluttertoast: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

